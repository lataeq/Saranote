name: saranote

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-saranote.sql:ro

  n8n:
    image: n8nio/n8n:2.4.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env.production}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env.production}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      SARANOTE_APP_BASE_URL: http://app:3000
      SARANOTE_ALERT_EMAIL: ${SARANOTE_ALERT_EMAIL:?Set SARANOTE_ALERT_EMAIL in .env.production}
    volumes:
      - n8n_data:/home/node/.n8n

  app:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      SARANOTE_APP_BASE_URL: https://${APP_HOST:?Set APP_HOST in .env.production}
      SARANOTE_N8N_WEBHOOK_SECRET: ${SARANOTE_N8N_WEBHOOK_SECRET:?Set SARANOTE_N8N_WEBHOOK_SECRET in .env.production}
      N8N_MEETING_SUMMARY_WEBHOOK_URL: http://n8n:5678/webhook/saranote/meeting-summary
      N8N_TASK_SUBMITTED_WEBHOOK_URL: http://n8n:5678/webhook/saranote/task-submitted
      TYPHOON_API_KEY: ${TYPHOON_API_KEY:?Set TYPHOON_API_KEY in .env.production}
    volumes:
      - app_data:/app/web/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - n8n
    environment:
      APP_HOST: ${APP_HOST}
      N8N_HOST: ${N8N_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  n8n_data:
  postgres_data:
  caddy_data:
  caddy_config:
